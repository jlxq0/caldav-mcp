apiVersion: v1
kind: Namespace
metadata:
  name: caldav-mcp
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caldav-mcp
  namespace: caldav-mcp
data:
  CALDAV_MCP_RESOURCE_URL: https://caldav-mcp.your-domain.example
  CALDAV_MCP_AUTHORIZATION_SERVER: https://login.your-domain.example/oidc
  CALDAV_MCP_STALWART_DAV_BASE_URL: https://dav.your-domain.example
  CALDAV_MCP_STALWART_AUDIENCE: https://caldav-mcp.your-domain.example
  CALDAV_MCP_DCR_CLIENT_ID: replace-with-your-public-client-id
  CALDAV_MCP_OAUTH_REDIRECT_URIS: https://claude.ai/api/mcp/auth_callback,https://claude.com/api/mcp/auth_callback,https://www.cursor.com/agents/mcp/oauth/callback,cursor://anysphere.cursor-mcp/oauth/callback,grokbot://mcp/oauth/callback,http://localhost:8787/callback,claude://claude.ai/oauth/callback,claude://oauth/callback,cowork://oauth/callback
  CALDAV_MCP_BIND_ADDR: 0.0.0.0:3000
  CALDAV_MCP_LOG_FORMAT: json
  RUST_LOG: caldav_mcp=info,tower_http=info,rmcp=warn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caldav-mcp
  namespace: caldav-mcp
spec:
  replicas: 1
  selector:
    matchLabels: { app: caldav-mcp }
  template:
    metadata:
      labels: { app: caldav-mcp }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/jlxq0/caldav-mcp:<version>@sha256:<digest>
          envFrom:
            - configMapRef: { name: caldav-mcp }
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
          ports:
            - { name: http, containerPort: 3000 }
            - { name: metrics, containerPort: 9090 }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: caldav-mcp
  namespace: caldav-mcp
spec:
  selector: { app: caldav-mcp }
  ports:
    - { name: http, port: 80, targetPort: http }
